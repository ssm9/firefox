---
# Firefox fork build pipeline, run by Woodpecker on the NAS.
#
# Each step invokes the same function the standalone loop calls, through
# `build-loop.sh step <phase>`, so the two entry points cannot drift apart.
#
# Two kinds of state cross step boundaries, and neither can live in /tmp,
# because every step is its own container:
#   /state/ci         the version and tag being built, and each target's objdir
#   /state/artifacts  the built MARs and installers
#
# Trigger from a Woodpecker cron (every 6h). The detect step records whether
# there is anything to do; later steps no-op if not, so a quiet poll is a short
# green run rather than a failure.

# Two checkouts live under /src and both are managed by the build server:
# /src/firefox is a release-tag tree with the fork patch applied, and
# /src/fork-tools is a sparse checkout of the tooling. Cloning either per
# pipeline would be absurd -- the Firefox tree alone is over 6 GB.
skip_clone: true

steps:
  - name: detect
    image: firefox-fork-builder:latest
    commands:
      - /usr/local/bin/build-loop.sh step detect

  # Checks out the release tag and applies the fork's changes as a single
  # three-way patch. Failure here means upstream changed code the series
  # touches; the conflict markers are left in /src/firefox for inspection and
  # nothing is published.
  - name: patch
    image: firefox-fork-builder:latest
    commands:
      - /usr/local/bin/build-loop.sh step patch
    depends_on: [detect]

  # The two targets run concurrently. This does not halve wall-clock time --
  # they share the same cores, so the gain is only from overlapping one build's
  # serial stretches (gkrust, the libxul link) with the other's parallel work.
  #
  # Cap BUILD_JOBS at roughly half the core count in the agent environment.
  # Without it each build sizes itself for the whole machine, and two of those
  # oversubscribe the CPU and can collide at peak memory, where two libxul
  # links together are the most likely way to exhaust RAM.
  - name: build-linux64
    image: firefox-fork-builder:latest
    commands:
      - /usr/local/bin/build-loop.sh step build linux64
      - /usr/local/bin/build-loop.sh step mar linux64
    depends_on: [patch]
    failure: ignore

  - name: build-win64
    image: firefox-fork-builder:latest
    commands:
      - /usr/local/bin/build-loop.sh step build win64
      - /usr/local/bin/build-loop.sh step mar win64
    depends_on: [patch]
    failure: ignore

  # Each target publishes as soon as it is ready rather than waiting for the
  # other. Targets have separate MARs and separate manifest paths, so these do
  # not conflict; publish_target stages manifests per target for that reason.
  - name: publish-linux64
    image: firefox-fork-builder:latest
    commands:
      - /usr/local/bin/build-loop.sh step publish linux64
    depends_on: [build-linux64]
    failure: ignore

  - name: publish-win64
    image: firefox-fork-builder:latest
    commands:
      - /usr/local/bin/build-loop.sh step publish win64
    depends_on: [build-win64]
    failure: ignore

  # Owns last-built, and is the step whose colour reflects the whole run.
  # Recording last-built inside a per-target publish would mark the release
  # done while another target was still failing, so it would never be retried.
  - name: finalize
    image: firefox-fork-builder:latest
    commands:
      - /usr/local/bin/build-loop.sh step finalize
    depends_on: [publish-linux64, publish-win64]
