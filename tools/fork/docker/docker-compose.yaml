---
# Firefox fork build server for TrueNAS SCALE 24.10 (Electric Eel) or newer.
#
# Install via Apps > Discover Apps > Custom App > Install via YAML.
#
# Before installing, read tools/fork/README.md -- this stack will refuse to
# start until the MAR signing key and the update hostname are in place.
#
# Replace every /mnt/tank/... path below with real dataset paths on your pool.

services:
  # ---------------------------------------------------------------------
  # nginx: serves manifests and MARs.
  #
  # Sits behind nginx-proxy-manager, which is a separate TrueNAS app with its
  # own compose network, so the two cannot reach each other by service name.
  # Publishing a host port is the way across that boundary: point the NPM
  # proxy host at <nas-ip>:${WEB_PORT}.
  #
  # This port is plain HTTP and unauthenticated. That is fine because it is
  # only reachable on the LAN and over the WireGuard tunnel, and because MAR
  # signature verification -- not the transport -- is what stops a malicious
  # update from being installed. Do not forward it from the internet.
  # ---------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: firefox-fork-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    volumes:
      - /mnt/tank/firefox-fork/www:/www:ro
      - /mnt/tank/firefox-fork/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ---------------------------------------------------------------------
  # builder: polls upstream and rebuilds when a new release appears.
  #
  # Firefox is a heavy build. Give this as many cores and as much RAM as the
  # NAS can spare; budget ~50 GB of disk for /obj plus ~40 GB for the sccache.
  # ---------------------------------------------------------------------
  builder:
    # Built by hand on the NAS rather than declared with `build:` -- TrueNAS's
    # "Install via YAML" pulls images and does not reliably run a build step.
    # See DEPLOY.md; the tag must already exist locally or the app will fail to
    # start with an image-not-found error.
    image: firefox-fork-builder:latest
    container_name: firefox-fork-builder
    restart: unless-stopped
    environment:
      # Compiled into every build. Must match build/application.ini.in exactly,
      # scheme included, and must be a name that will not change -- existing
      # installs keep asking whichever URL they were built with.
      #
      # This is the hostname you configure in nginx-proxy-manager. It has to
      # resolve for WireGuard clients, not just on the LAN.
      FORK_UPDATE_HOST: ${FORK_UPDATE_HOST:-firefox-builds.sai.town}
      FORK_UPDATE_SCHEME: ${FORK_UPDATE_SCHEME:-https}

      # Targets to build. Drop win64 to skip the MSVC download entirely.
      FORK_TARGETS: ${FORK_TARGETS:-linux64 win64}

      FORK_REPO: https://github.com/ssm9/firefox
      FORK_BRANCH: ssm9/fork-build
      UPSTREAM: https://github.com/mozilla-firefox/firefox

      # Upstream ships dot releases (153.0.1) on their own schedule and those
      # are the security updates, so poll more often than the 4-week major
      # cadence. Six hours keeps latency low without hammering GitHub.
      POLL_INTERVAL: "21600"

      # Leave unset to use all cores. Set it lower if builds starve the NAS
      # of CPU for its actual job.
      BUILD_JOBS: ${BUILD_JOBS:-}

      # Optional: any URL that accepts a POST body, e.g. an ntfy topic.
      # Used for "new release building", "published", and failure notices.
      NOTIFY_URL: ${NOTIFY_URL:-}
    volumes:
      - /mnt/tank/firefox-fork/src:/src
      - /mnt/tank/firefox-fork/state:/state
      - /mnt/tank/firefox-fork/obj:/obj
      - /mnt/tank/firefox-fork/www:/www
      # MSVC toolchain for the win64 cross-build. Mounted read-write because
      # the builder downloads it from Microsoft itself on first run; leave the
      # directory empty and it will populate.
      - /mnt/tank/firefox-fork/vs:/vs
