# Sits behind nginx-proxy-manager, which forwards to this container's published
# host port. Serves static files only, and the absolute URLs in the manifests
# are generated by the build loop from FORK_DOWNLOAD_BASE_URL rather than from
# request headers -- so nothing here depends on X-Forwarded-* being correct.
#
# Access logs show NPM's address rather than the real client. Add
# set_real_ip_from with NPM's subnet if that ever matters.

server {
    listen 80 default_server;
    server_name _;

    root /www;
    autoindex off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Manifests. Written by the build loop as
    # /www/updates/<BUILD_TARGET>/<channel>/update.xml, matching the URL
    # template compiled into build/application.ini.in.
    #
    # Must not be cached: a stale manifest means clients keep being offered a
    # version they already have, or worse, one whose MARs have been replaced.
    location /updates/ {
        types { }
        default_type application/xml;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # MARs and installers, published under a per-version directory. These are
    # immutable once written, so they cache freely.
    location /downloads/ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        autoindex on;

        # The updater does ranged requests when resuming an interrupted
        # download; nginx serves these for static files by default.
    }

    # Build server state, for checking on things without shelling in.
    location = /status.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # Landing page. Not part of the update protocol -- Firefox never requests
    # this -- but it is the fastest way to check the server by hand, so the
    # links are the real paths a client uses rather than placeholders.
    location = / {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>firefox fork update server</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;max-width:44rem;margin:3rem auto;padding:0 1.5rem}
h1{font-size:1.3rem}h2{font-size:1rem;margin-top:2rem}
a{color:#0060df}code{background:#f0f0f4;padding:.1em .35em;border-radius:3px}
@media(prefers-color-scheme:dark){
body{background:#1c1b22;color:#fbfbfe}a{color:#00ddff}code{background:#2b2a33}}
</style>
<h1>firefox fork update server</h1>
<p>Serves updates for unofficial Firefox builds carrying the
<code>downloads.onDeterminingFilename</code> patch series.</p>
<h2>Status</h2>
<p><a href="/status.json">status.json</a> &mdash; what the build server is doing
right now. <code>state</code> is one of idle, building, ok, conflict, failed.</p>
<h2>Downloads</h2>
<p><a href="/downloads/">browse builds</a> &mdash; installers and MARs, one
directory per version.</p>
<h2>Update manifests</h2>
<p>These are what Firefox itself fetches. A 404 here means nothing has been
published for that platform yet. Windows has two entries because the ABI in
BUILD_TARGET carries the <em>running</em> CPU, so one build is asked for under
both paths.</p>
<ul>
<li><a href="/updates/Linux_x86_64-gcc3/ssm9/update.xml">linux64</a></li>
<li><a href="/updates/WINNT_x86_64-msvc-x64/ssm9/update.xml">win64 on x64</a></li>
<li><a href="/updates/WINNT_x86_64-msvc-aarch64/ssm9/update.xml">win64 on arm64</a></li>
<li><a href="/updates/Darwin_aarch64-gcc3/ssm9/update.xml">macos on Apple Silicon</a></li>
</ul>
';
    }

    location / {
        return 404;
    }
}
