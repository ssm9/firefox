server {
    listen 80 default_server;
    server_name _;

    root /www;
    autoindex off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Manifests. Written by the build loop as
    # /www/updates/<BUILD_TARGET>/<channel>/update.xml, matching the URL
    # template compiled into build/application.ini.in.
    #
    # Must not be cached: a stale manifest means clients keep being offered a
    # version they already have, or worse, one whose MARs have been replaced.
    location /updates/ {
        types { }
        default_type application/xml;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # MARs and installers, published under a per-version directory. These are
    # immutable once written, so they cache freely.
    location /downloads/ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        autoindex on;

        # The updater does ranged requests when resuming an interrupted
        # download; nginx serves these for static files by default.
    }

    # Build server state, for checking on things without shelling in.
    location = /status.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        default_type text/plain;
        return 200 "firefox fork update server\n\n/updates/<build-target>/<channel>/update.xml\n/downloads/<version>/\n/status.json\n";
    }

    location / {
        return 404;
    }
}
